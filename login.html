<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>로그인 | 고래시티 아카이브</title>

  <link rel="stylesheet" href="./css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" 
    rel="stylesheet"
  >

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <header class="header">
    <a href="./index.html" class="logo">
      <span class="logo-icon">🐋</span>
      <span>고래시티 아카이브</span>
    </a>

    <nav class="nav">
      <a href="./index.html">홈</a>
      <a href="./clips.html">클립</a>
      <a href="./index.html#hotclips">핫클립</a>
      <a href="./worldcups.html">월드컵</a>
      <a href="./people.html">인물</a>
      <a href="./index.html#events">사건기록</a>
      <a href="./admin.html">관리자</a>
    </nav>

    <button class="login-btn" id="headerLoginBtn">로그인</button>
  </header>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-title">
        <p class="hero-subtitle">WHALE CITY ACCOUNT</p>
        <!-- [변경] 제목: 이메일 로그인 → SOOP 로그인으로 변경 -->
        <h1>로그인</h1>
        <!-- [변경] 안내 문구: SOOP 계정으로 로그인하면 누구나 기여 가능함을 안내 -->
        <p>SOOP 계정으로 로그인하면 클립·인물·월드컵을 등록하고 수정할 수 있습니다.<br>수정 시 SOOP 닉네임이 자동으로 기록됩니다.</p>
      </div>

      <!-- [변경] 이메일/비밀번호 탭과 폼 전부 제거 → SOOP 로그인 버튼 하나로 교체
           이유: 별도 회원가입 없이 SOOP 계정 하나로 바로 기여할 수 있게 함
                 SOOP 로그인 버튼 클릭 → /api/soop-login → SOOP OAuth → /api/soop-callback
                 → 닉네임 전달 → main.js에서 localStorage 저장 + Firebase 익명 로그인 -->
      <a href="/api/soop-login" class="auth-submit-btn">
        SOOP으로 로그인
      </a>

      <!-- SOOP 콜백 처리 결과 메시지 (main.js에서 제어) -->
      <p class="auth-message" id="soopMessage"></p>

    </section>

  </main>

  <footer class="footer">
    <p>© 2026 고래시티 아카이브. Fan Archive Project.</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
