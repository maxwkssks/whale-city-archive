<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>클립 모아보기 | 고래시티 아카이브</title>

  <link rel="stylesheet" href="./css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" 
    rel="stylesheet"
  >
</head>
<body>

  <header class="header">
    <a href="./index.html" class="logo">
      <span class="logo-icon">🐋</span>
      <span>고래시티 아카이브</span>
    </a>

    <nav class="nav">
      <a href="./index.html">홈</a>
      <a href="./clips.html" class="active">클립</a>
      <a href="./index.html#hotclips">핫클립</a>
      <a href="./worldcups.html">월드컵</a>
      <a href="./people.html">인물</a>
      <a href="./index.html#events">사건기록</a>
      <a href="./admin.html">관리자</a>
    </nav>

    <button class="login-btn" id="headerLoginBtn">로그인</button>
  </header>

 <div class="section-title clips-title-row">
  <div class="clips-title-inner">
    <p class="hero-subtitle">WHALE CITY CLIPS</p>

    <div class="clips-title-main">
      <h1>클립 모아보기</h1>

      <button type="button" class="clip-upload-page-btn" onclick="location.href='./upload.html'">
        클립 올리기
      </button>
    </div>

    <p>
      고래시티의 웃긴 장면, 명장면, 사건, 감동 장면을 한곳에서 찾아보세요.
    </p>
  </div>
</div>

    <section class="filter-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="클립 제목이나 태그를 검색하세요"
      />

      <div class="filter-group">
  <button class="filter-btn active" data-tag="전체">전체</button>
  <button class="filter-btn" data-tag="레전드">레전드</button>
  <button class="filter-btn" data-tag="웃긴장면">웃긴장면</button>
  <button class="filter-btn" data-tag="명장면">명장면</button>
  <button class="filter-btn" data-tag="사건">사건</button>
  <button class="filter-btn" data-tag="감동">감동</button>
  <button class="filter-btn" data-tag="연애">연애</button>
  <button class="filter-btn" data-tag="노래">노래</button>
  <button class="filter-btn" data-tag="선거">선거</button>
  <button class="filter-btn" data-tag="전투">전투</button>
</div>

      </div>

      <select id="sortSelect">
        <option value="latest">최신순</option>
        <option value="views">조회순</option>
        <option value="likes">좋아요순</option>
      </select>
    </section>

    <section class="section clip-list-section">
      <div class="section-title">
        <h2>전체 클립</h2>
        <span id="clipCount">0개</span>
      </div>

      <div class="clip-grid" id="clipList"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 고래시티 아카이브. Fan Archive Project.</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
